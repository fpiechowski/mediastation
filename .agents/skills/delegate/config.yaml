# Configuration of the /delegate skill.
#
# adapter: where the delegate's thread lives
#   t3-code      a T3 Code thread (any provider T3 offers: Claude, Codex, ...)
#   codex-cli    a Codex CLI session (`codex exec`, resumable with `codex resume <id>`)
#   opencode     an OpenCode session (`opencode run`, resumable with `opencode -s <id>`)
#   chatgpt-app  a ChatGPT / Codex desktop app thread (only when the session has that app's thread tools)
# model:  a name as people say it ("Opus 5.5", "GPT-6.1 Sol"); the skill maps it to the adapter's model id.
# effort: reasoning effort ("low", "medium", "high", "xhigh", "max", ...), if the model supports it.
#
# Every field is optional. A field left out falls through: request > matching route > default > any available.

default:
  adapter: t3-code
  model: Opus 5.5
  # effort: high

# Routes are checked in order; the first whose phrases match the task (by meaning, in any language) wins.
# A phrase may also be a skill name, e.g. "bmad-code-review".
# Example with an adapter:
#   - phrases: ["code review", "przegląd kodu", "bmad-code-review"]
#     adapter: t3-code
#     model: GPT-6.1 Sol
#     effort: xhigh
routes:
  - phrases: ["bmad-loop", "bmad-loop-resolve", "bmad-loop-setup", "bmad-loop-sweep"]
    model: Sonnet 5.5
    effort: high
  - phrases: ["bmad-agent-po", "Sofia", "product owner"]
    model: Opus 5.5
    effort: medium
  - phrases: ["bmad-build", "bmad-build-auto"]
    model: Opus 5.5
    effort: high
  - phrases: ["bmad-architecture", "bmad-ux", "bmad-prd", "bmad-product-brief", "bmad-brief"]
    model: Opus 5.5
    effort: xhigh
  # Last on purpose: the general BMad help route must not catch the specific bmad-* skills above.
  - phrases: ["bmad", "bmad help", "pomoc bmad", "co dalej w bmad"]
    model: Haiku 5.5
    effort: low

# Per-adapter launch settings.
adapters:
  codex-cli:
    sandbox: workspace-write   # read-only | workspace-write | danger-full-access
  opencode:
    auto: true                # true: auto-approve permissions that are not explicitly denied

[[entry]]
id = 10
type = "story"
title = "Dźwięk trzyma regułę MediaStation mimo ręcznych zmian w mikserze"
description = "U3 z odbioru (DW-45), według reguły audio jako stanu docelowego z AD-5 (decyzja 2026-10-27). AudioRouter trzyma flagę wyciszenia każdej sesji drzewa z regułą równą regule w obie strony: `UnmuteProcessTree` odcisza także sesje wyciszone poza nim (mikser, poprzednia instancja), co zastępuje „odciszam tylko to, co sam wyciszyłem” (DW-37). Skan odczytuje rzeczywisty stan sesji drzew z regułą i poprawia różnicę przy każdej komendzie, przy nowej sesji i nowym urządzeniu oraz okresowo co ok. 1 s, dopóki istnieje reguła; powiadomienia o zmianie głośności sesji (`OnSimpleVolumeChanged`, `OnChannelVolumeChanged`) mogą go tylko przyspieszyć, a własne zmiany idą z własnym GUID-em kontekstu, więc nie wywołują skanu. Poprawka zmiany z zewnątrz daje `audioSessionOverridden{ rootPid, pid, muted }` raz na sesję i wartość reguły. Fallback `IChannelAudioVolume`: wyciszona = wszystkie kanały 0, poziomy sprzed wyciszenia tylko w pamięci, bez nich odciszenie ustawia 1.0. Koniec reguły (`ForgetProcessTree`, śmierć korzenia, zamknięcie MediaStation) raz odcisza każdą sesję ostatnio przypisaną do drzewa, a Orchestrator przy `CloseApp` i `RestartApp` wysyła `UnmuteProcessTree` przed zamknięciem procesu (AD-5, AD-10), bo nowa instancja dziedziczy wyciszenie. Callbacki Core Audio tylko zlecają skan wątkowi AudioRoutera. Głośność sesji i systemu oraz sesje spoza drzew z regułą zostają nietknięte. Logika uzgadniania poza typami COM, z testami."
verify = "`dotnet test` przechodzi z testami: sesja drzewa wyciszona z zewnątrz przy regule odciszenia wraca do odciszenia i odwrotnie z jednym `audioSessionOverridden`, `UnmuteProcessTree` odcisza sesję spoza rejestru, własna zmiana z GUID-em nie wywołuje skanu, kanały bez zapamiętanych poziomów wracają na 1.0, `ForgetProcessTree` i zamknięcie MediaStation odciszają sesje drzewa, `CloseApp` i `RestartApp` wysyłają `UnmuteProcessTree` przed zamknięciem, sesje spoza drzew nietknięte. Na bieżącej maszynie z dev harnessem i `tools/fixtures/harness-audio.html`: ręczne odciszenie Edge w tle w mikserze (albo `ISimpleAudioVolume` ze skryptu) wraca do wyciszenia w ok. 1 s z `audioSessionOverridden muted:true`, ręczne wyciszenie aplikacji na wierzchu wraca do odciszenia z `muted:false`, a po zamknięciu aplikacji z AppMenu jej sesje nie są wyciszone."
covers = ["R5", "R6", "R9"]
after = []
hitl = false
risk = "medium"
references = ["tickets/epic-windows-audio/epic-windows-audio-um760-acceptance.md, Uwagi użytkownika U3, Wyniki S19", "deferred-work.md, DW-45, DW-37", "architecture-mediastation/architecture-mediastation.md, AD-5 (Reguła audio to stan docelowy, Zamykanie aplikacji), AD-4, AD-14"]


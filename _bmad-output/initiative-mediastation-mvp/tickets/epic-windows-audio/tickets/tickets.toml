hitl = false
risk = "medium"
references = ["architecture-mediastation/architecture-mediastation.md, AD-5, AD-10 (adopcja, wybudzenie), AD-13 (`AppWindowAttached` nie czeka na CDP), AD-14"]

[[entry]]
id = 4
type = "story"
title = "ForegroundChanged z WinEvent i właściciel okna w logu"
description = "WindowManager rejestruje na swoim wątku z pętlą komunikatów (story 1) `SetWinEventHook(EVENT_SYSTEM_FOREGROUND, WINEVENT_OUTOFCONTEXT)` i raportuje każdą zmianę jako `ForegroundChanged{ hwnd }` z oknem najwyższego poziomu (`GA_ROOT`), także po własnej komendzie. Orchestrator rozpoznaje właściciela okna czystą funkcją w Core (shell; aplikacja po `hwnd`, a gdy to nie pasuje, po `rootPid` jak w bramce AD-8; obce) i loguje `foregroundChanged{ hwnd, owner: shell|app|foreign, appId }`, bez zmiany trybu, stanu aplikacji i dźwięku (Decision w Notes epiki, AD-8). Wpis zastępuje dzisiejszy log gałęzi `ForegroundChanged` w `OrchestratorLoop.cs`, więc jedno zdarzenie daje jeden wpis."
verify = "`dotnet test` przechodzi z testami rozpoznania właściciela (shell, aplikacja po `hwnd`, po `rootPid`, obce, `hwnd` 0) i z testem, że `ForegroundChanged` nie zmienia trybu, stanu ani komend. Na bieżącej maszynie z dev harnessem: Alt+Tab z shella na zminimalizowane okno Edge daje jeden `foregroundChanged owner:app` z `appId` i stan bez zmian, Alt+Tab na Notatnik daje `owner:foreign`, a Home wraca na shell z `owner:shell`."
covers = ["R3"]
after = [1, 3]
hitl = false
risk = "medium"
references = ["architecture-mediastation/architecture-mediastation.md, AD-15 (`ForegroundChanged`, Alt+Tab [ASSUMPTION]), AD-8 (`mode` nie zmienia się przy przełączeniu okna; dopasowanie po `hwnd` i `rootPid`)"]


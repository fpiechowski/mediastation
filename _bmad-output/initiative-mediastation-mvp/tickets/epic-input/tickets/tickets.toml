hitl = false
risk = "high"
references = ["architecture-mediastation/architecture-mediastation.md, AD-2 (wątki)", "architecture-mediastation/architecture-mediastation.md, AD-13 (Logi)", "../../spike/win/HomeLogger.cs (referencja zachowania, nie kod do skopiowania)"]

[[entry]]
id = 3
type = "story"
title = "`--calibrate-input` i przycisk Klawiatura"
description = "Zastępuje `modeUnsupported` dla `CliMode.CalibrateInput` (mutex jak w każdym trybie: wymaga zatrzymanej instancji głównej) trybem, który uruchamia źródła InputHub ze story 2 bez mapowania i bez połykania, przez 60 s albo do Esc z klawiatury loguje dla każdego przycisku urządzeń z `source: remote` w `input.json` (i wstrzykniętych VK przypisanych do nich) wpis `rawInput {signature, vk, scan, usagePage, usage, injected, hasVk, llBeforeRawMs}` z kolejnością zdarzenia hooka i `WM_INPUT`, i kończy się kodem 0, tak że autor wybiera przycisk Klawiatura spośród przycisków z VK i wpisuje go do `input.json` jako `keyboard`."
verify = "`dotnet test` przechodzi z testami Core: decyzja startu dla `--calibrate-input` nie daje już `modeUnsupported`, filtr kalibracji przepuszcza zdarzenia urządzeń `remote` i odrzuca zwykłą klawiaturę, `hasVk` jest `false` dla raportu HID bez VK, a wpis `\"0x..\": \"keyboard\"` w `input.json` daje Action `Keyboard`."
covers = ["CAP-3"]
after = [2, "1.5"]
hitl = false
risk = "medium"
references = ["architecture-mediastation/architecture-mediastation.md, AD-13 (Logi: surowe kody tylko w --calibrate-input)", "spec-mediastation/spec-mediastation.md, Open Questions (Przycisk Klawiatura na G20S Pro)"]

[[entry]]
id = 4
type = "story"
title = "Dowolna klawiatura i repeat strzałek"
description = "Dodaje w `input.json` urządzenie z sygnaturą `*` jako fallback dla każdej klawiatury bez własnego wpisu (`source: keyboard`; walidacja: najwyżej jedno; sample: Enter → ok, Escape → back, strzałki, `0x24` Home → home, `0x71` F2 → keyboard) oraz `phase: repeat` tylko dla strzałek: polityka sama generuje `repeat` po `timing.repeatDelayMs` co `timing.repeatIntervalMs` (nowe opcjonalne pola, domyślnie 400 i 120), ignoruje autorepeat systemu i przestaje na key-up; OK, Back, Home i Keyboard nie dostają `repeat`."
verify = "`dotnet test` przechodzi z testami na `FakeTimeProvider`: trzymana strzałka daje jedno `press`, potem `repeat` po progu i w interwale i koniec na key-up, trzymany Home i Back dają jedną Action bez `repeat`, walidacja odrzuca dwa urządzenia `*`, a klawisz zmapowany tylko w `*` daje Action z `source: keyboard`."
covers = ["CAP-3"]
after = [3]
hitl = false
risk = "low"
references = ["ux-mediastation/EXPERIENCE.md, Interaction Primitives (`phase: repeat` przewija wiersze)"]


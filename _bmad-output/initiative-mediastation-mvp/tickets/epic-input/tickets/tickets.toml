description = "Podmienia adapter tylko-log `SetInputRouting` z 2.3 na adapter InputHub, który trzyma lokalną kopię `{mode, appType, pointer, epoch}` (start: `shell`, `epoch` 0; przyjmowany tylko `epoch` ściśle większy od bieżącego), a polityka według tabeli AD-8 dla źródeł klawiatury decyduje: połyka i emituje Action albo przepuszcza (D-pad i OK w `app` + `moonlight`/`native`), Home zawsze połyka, `long` tylko dla OK w `shell` i `osk`, a key-up i autorepeat idą za decyzją pierwszego key-down także po zmianie trybu; adapter tylko-log `IActionSink` ze story 2 zastępuje wkładanie Actions do kolejki Orchestratora z 2.1 bez czekania (wpis `action` zostaje)."
verify = "`dotnet test` przechodzi z testami polityki routingu dla każdego wiersza tabeli AD-8 (klawiatura), odrzucenia równego i starszego `epoch`, OK w `app` + `web` jako `press` na key-down oraz key-up i autorepeat strzałki połkniętej w `shell` połykane także po przełączeniu na `app` + `moonlight`."
covers = ["CAP-3"]

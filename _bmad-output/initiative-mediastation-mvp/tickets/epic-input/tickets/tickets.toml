# Remote, keyboard & gamepad input — entries w kolejności budowy. tickets.py reads it.
# Kolejność tabel = kolejność budowy; `id` nie jest kolejnością.
# Jeden lane: każda story zmienia politykę wejścia w Core albo InputHub w `Platform/Input`, więc `after` tworzy łańcuch.
# `verify` to check, który pętla uruchamia sama; checki na UM760 są w Notes epiki (Odbiór na UM760).
# Decyzje przecinające kilka stories (decyzja po VK, korelacja, progi, kolejka Actions, CsWin32, znacznik `dwExtraInfo`, `clipHwnd`, kolizje z epiką 2) są w Notes epiki.
# Ścieżki w `references` są względne do folderu inicjatywy.

[[entry]]
id = 1
type = "story"
title = "Polityka wejścia w Core: jedna Action i reguła long"
description = "Dodaje w Core czystą politykę wejścia bez Win32: decyzję o połknięciu i `ActionKind` po samym VK ze scalonego mapowania urządzeń z `input.json` (walidacja odrzuca ten sam VK z różnym `kind` w dwóch urządzeniach), `source` z korelacji (wstrzyknięty VK z `LLKHF_INJECTED` przypisany do raportu HID Consumer tej samej sygnatury najwyżej 50 ms wcześniej daje `remote`, inaczej urządzenie z ostatniego `WM_INPUT` w oknie 50 ms, w ostateczności `keyboard`; sygnatura pasuje, gdy ścieżka urządzenia Raw Input zawiera ją bez rozróżniania wielkości liter), regułę jedno naciśnięcie = jedna Action (autorepeat systemu nie daje kolejnej), `press` na key-down, a dla OK w trybie `shell` (tryb jest parametrem polityki; routing dokłada story 5) `press` na key-up przed progiem albo samo `long` po progu z nowego opcjonalnego `timing.longPressMs` w `input.json` (domyślnie 600; schemat, walidacja, sample z Back `0xA6` i czterema strzałkami dongla), `tsMono` z pola `time` zdarzenia hooka, timer progu przez szew `NextDeadline`/`OnTimer(now)` na wstrzykniętym `TimeProvider` (bez ambient time, zakaz z 2.5), oraz kolejkę Actions bez ograniczenia rozmiaru, do której zapis nigdy nie czeka i nigdy nie gubi Action."
verify = "`dotnet test` przechodzi z testami polityki na `FakeTimeProvider`: połknięcie i `kind` po VK, `source: remote` dla wstrzykniętego `0xAC` po raporcie HID 0x0223 dongla w oknie i `keyboard` bez raportu, autorepeat bez drugiej Action, OK z `press` na key-up przed progiem i samym `long` po progu, nieznany VK bez Action i bez połknięcia, zapis do kolejki bez czytelnika nie czeka, oraz walidacja `timing.longPressMs` i konfliktu VK między urządzeniami."
covers = ["CAP-3"]
after = ["1.2", "1.4", "1.6"]
hitl = false
risk = "high"
references = ["architecture-mediastation/architecture-mediastation.md, AD-8", "architecture-mediastation/architecture-mediastation.md, AD-14", "research-browser-control-for-streaming-services/digests/spike-um760.md, claims S10", "../../spike/spike-results.md, S10 (tabela kodów dongla)"]

[[entry]]
id = 2
type = "story"
title = "Tracer bullet: pilot na donglu daje Actions z wątku Input"

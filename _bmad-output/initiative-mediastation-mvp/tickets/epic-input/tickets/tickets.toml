verify = "`dotnet test` przechodzi z testem Core, że adapter tylko-log sinka dla sekwencji Actions zapisuje wyłącznie wpisy `action` (bez VK, scan i usage), a `inputHubError` nie zawiera kodów klawiszy; build Release self-contained przechodzi."
covers = ["CAP-3"]

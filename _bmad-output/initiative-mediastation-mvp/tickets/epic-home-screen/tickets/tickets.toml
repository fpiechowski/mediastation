[[entry]]
id = 5
type = "story"
title = "Kafelek wg DESIGN.md: ikona, tytuł, chip i linia stanu"
description = "Snapshot dostaje `icon` (może być `null`) i `type` aplikacji z `apps.json`, a kafelek używa `title` ze snapshotu ze story 3; obrazki ładuje dzięki `img-src https://icons.mediastation.example` w CSP ze story 11. Ikony wg AD-11: `icon` to sama nazwa pliku w `config/icons/` (walidacja odrzuca separatory ścieżki i `..`), App sprawdza plik przy ładowaniu konfiguracji i przy braku loguje `warn` `appIconMissing{appId, icon}` i podaje Core `icon: null`; host mapuje `icons.mediastation.example` → `config/icons/` (`DenyCors`) w Debug i Release, a Shell składa URL `https://icons.mediastation.example/<encodeURIComponent(icon)>` i przy `null` albo błędzie obrazka pokazuje sam tytuł. Kafelek pokazuje ikonę, tytuł oraz chip i linię stanu z tabeli Stany kafelka w `DESIGN.md` dla każdego stanu cyklu życia, z ikonami Material Symbols Rounded i fontem Roboto Flex bundlowanymi lokalnie; linia `Background` bez tytułu treści (`web`: chip `pause` „Wstrzymane” i „W tle · wstrzymane”; `moonlight` i `native`: chip `volume_off` „Wyciszony” i „W tle · wyciszony”; Decisions w Notes epiki); fokus `focus-ring` z przejściem ok. 150 ms. Walidacja `apps.json` odrzuca puste albo złożone ze spacji `title` i `icon` (F18)."
verify = "`dotnet test` przechodzi z testami walidacji pustego i złożonego ze spacji `title` i `icon` oraz `icon` z separatorem ścieżki albo `..`, i z testem `icon: null` w snapshocie przy braku pliku; `npm test` przechodzi z testem chipa i linii stanu dla każdego stanu na snapshotach testowych i z testem fallbacku przy braku ikony; na bieżącej maszynie kafelek `Failed` pokazuje „Nie odpowiada” i „Coś się zacięło. Wciśnij OK”, kafelek z plikiem w `config/icons/` pokazuje ikonę, a bez pliku sam tytuł i `warn appIconMissing` w logu."

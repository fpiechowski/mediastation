[[entry]]
id = 3
type = "story"
title = "Tracer bullet: D-pad przesuwa fokus po kafelkach, OK uruchamia aplikację"
description = "Najcieńsza ścieżka przez wszystkie warstwy (AD-8, AD-16): Orchestrator zapamiętuje bieżący tryb i w trybie `shell` przekazuje strzałki (`press`, `repeat`), Ok (`press`, `long`), Back i Home jako osobną listę Actions w wyniku kroku obok snapshotu (Home po zwykłej obsłudze zawsze); most wysyła je komunikatem `action` jedną kolejką FIFO ze snapshotem (oczekujący snapshot przed każdą `action`), bez buforowania: `action` przed `ready`, po nawigacji strony albo starsza o ok. 1 s jest odrzucana z `shellActionDropped`. Snapshot dostaje `title` z `apps.json` (`icon` i `type` dokłada story 5). Shell renderuje kafelki w jednym rzędzie z jednym fokusem kluczowanym `appId` (logika fokusu poza komponentami React, bez DOM), wskaźnik nie przenosi fokusu, a OK na kafelku `NotRunning` albo `Background` wysyła Intent `launchApp`; Orchestrator przyjmuje `LaunchApp` tylko z `NotRunning` albo `Background` i bez innej aktywnej aplikacji, inaczej `intentIgnored`. Most od strony przyjmuje tylko jawną listę (`ready`, `launchApp`, `restartApp`, `closeApp`) i tylko z origin shella (`e.Source`, F11), resztę odrzuca z `bridgeMessageRejected`; walidacja wiadomości i kolejka leżą poza typami WebView2 i mają testy przez linkowane źródła App (R4/N3 dla `ShellBridge`). Dochodzi Vitest jako `npm test` w `web/`."
verify = "`dotnet test` przechodzi z testami: Action w trybie `shell` trafia do Shell, w trybie `app` nie, a Home trafia zawsze po obsłudze; snapshot kroku wychodzi przed jego `action`; `action` przed `ready` i nieświeża daje `shellActionDropped`; Intent z obcego origin i `snapshot` od Shell są odrzucane z `bridgeMessageRejected`; `LaunchApp` z mostu dociera do Orchestratora, a w stanie innym niż `NotRunning`/`Background` daje `intentIgnored`. `npm test` w `web/` przechodzi z testami fokusu (Lewo/Prawo po `appId`, OK wysyła `LaunchApp`). Na bieżącej maszynie strzałki klawiatury przesuwają fokus po kafelkach, a OK na kafelku daje w logu `startWithoutHost` i kafelek w `Failed`."
covers = ["R3", "R5", "R8"]
after = [1, 2, "1.1", "1.7", "2.10", "3.5"]
hitl = false
risk = "high"
plan_checkpoint = true
references = ["architecture-mediastation/architecture-mediastation.md, AD-8 (tabela routingu, wiersz shell; Actions w trybie shell; AppMenu, sprawdzanie Intents)", "architecture-mediastation/architecture-mediastation.md, AD-16", "architecture-mediastation/architecture-mediastation.md, Consistency Conventions (Testy kodu App)", "tickets/epic-foundation-contracts/epic-foundation-contracts-retrospective.md, F11, R4/N3"]

[[entry]]
id = 11
type = "story"
title = "Host shella: blokada nawigacji, nowe okna i CSP"
description = "Domyka bezpieczeństwo hosta shella z AD-16: WebView2 anuluje każdą nawigację głównej ramki i ramek poza origin shella (`NavigationStarting`, `FrameNavigationStarting`, wpis `navigationBlocked`) i każde nowe okno (`newWindowBlocked`), anulowana nawigacja (`OperationCanceled`) nie jest logowana jako `navigationFailed` (R7/N8), a `index.html` shella ma CSP co najmniej `script-src 'self'; img-src 'self' https://icons.mediastation.example; frame-src 'none'; object-src 'none'` (Debug dokłada tylko to, czego wymaga Vite dev server, m.in. jego origin i `ws:` dla HMR). Decyzje nawigacji leżą poza typami WebView2 i mają testy przez linkowane źródła App (R4/N3 dla `ShellWindow`); `ProcessFailed` (R4/N3) dostaje test albo manualny check z wpisem w planie."
verify = "`dotnet test` przechodzi z testami decyzji nawigacji: origin shella przepuszczony, inny origin i ramka spoza origin anulowane z `navigationBlocked`, `OperationCanceled` bez `navigationFailed`; na bieżącej maszynie build Release startuje shell bez naruszeń CSP w konsoli WebView2, a ustawienie `window.location` na obcy adres z DevTools nie zmienia strony i daje `navigationBlocked` w logu; `window.open` z DevTools nie otwiera okna i daje `newWindowBlocked`."
covers = ["R8"]
after = [3]
hitl = false
risk = "medium"
references = ["architecture-mediastation/architecture-mediastation.md, AD-16 (Bezpieczeństwo mostu)", "tickets/epic-foundation-contracts/epic-foundation-contracts-retrospective.md, F11, R4/N3, R7/N8"]


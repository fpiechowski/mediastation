references = ["architecture-mediastation/architecture-mediastation.md, AD-8 (AppMenu), AD-10", "ux-mediastation/EXPERIENCE.md, Component Patterns (AppMenu), J4", "ux-mediastation/mockups/key-home-failed-appmenu.html"]


# Home screen — entries w kolejności budowy. tickets.py reads it.
# Kolejność tabel = kolejność budowy; `id` nie jest kolejnością.
# Lane Core: 1 i 2 równolegle, potem tracer 3. Lane web: 3 → 4 → 5 → 6, 4 → 7, 5 + 7 → 8; 9 równolegle po 3; 10 na końcu.
# Decyzje przecinające kilka stories (AppMenu w Shell, linia Background bez tytułu, ikony w config/icons/, przypisanie długu) są w Notes epiki.
# Ścieżki w `references` są względne do folderu inicjatywy.

[[entry]]
id = 1
type = "story"
title = "Generowanie kontraktów działa przy Application Control"
description = "Sprawia, że eksport JSON Schema z rekordów Core i generowanie typów TS w `web/contracts` działają na maszynie z Application Control bez ręcznych kroków (DW-28): dziś świeży niepodpisany `MediaStation.SchemaExport.dll` jest blokowany (0x800711C7), więc `dotnet build` nie odświeża schematów, a publish wymaga `-p:SkipWebBuild=true`, ręcznego `npm run build` i kopiowania `web/shell/dist`. Sposób (np. eksport z przebiegu testów albo inny host procesu) wybiera story; ręcznie napisane `set-managed-windows.schema.json` i `generated/set-managed-windows.ts` zastępuje wynik generatora."
verify = "Na bieżącej maszynie: zmiana pola w rekordzie Core, potem `dotnet build` i `npm run build` w `web/` dają zaktualizowany schemat i typ TS bez kroków ręcznych, także gdy świeży niepodpisany `MediaStation.SchemaExport.dll` byłby zablokowany (generowanie nie uruchamia osobnego niepodpisanego exe ani dll), a zwykły `dotnet publish` zawiera `shell/`; `dotnet test` przechodzi, w tym `CoreMessageContractTests`."
covers = ["R8"]
after = ["1.2"]
hitl = false
risk = "medium"
references = ["deferred-work.md, DW-28", "../plan-ad8-foreground-gate.md"]

[[entry]]
id = 2
type = "story"
title = "Refactor otwierający: handlery Orchestratora i podział testów"
description = "Przed pierwszą nową gałęzią dispatchu (DW-19) wydziela z `Orchestrator.Handle` (12 gałęzi) grupy handlerów per funkcja (start/wybudzenie, launch, attach/adopcja, Home, stop/restart, awarie, timery, zarządzane okna) i dzieli `OrchestratorTests.cs` (1909 linii, jedna klasa) na pliki według tych samych grup ze wspólnymi helperami; zachowanie się nie zmienia."
verify = "`dotnet test` przechodzi z tą samą liczbą testów co przed zmianą, żaden plik testów Orchestratora nie przekracza ok. 600 linii, a `Orchestrator.Handle` tylko deleguje do grup."
covers = ["R5"]
after = []
hitl = false
risk = "low"
references = ["deferred-work.md, DW-19"]

[[entry]]
id = 3
type = "story"
title = "Tracer bullet: D-pad przesuwa fokus po kafelkach, OK uruchamia aplikację"
description = "Najcieńsza ścieżka przez wszystkie warstwy: Orchestrator zapamiętuje bieżący tryb i w trybie `shell` przekazuje Actions (Up, Down, Left, Right, Ok, Back, Home) do Shell komunikatem przez most; snapshot dostaje `title` i `icon` z `apps.json`; Shell renderuje kafelki aplikacji w jednym rzędzie z jednym fokusem kluczowanym `appId`, a OK na kafelku `NotRunning` albo `Background` wysyła Intent `LaunchApp` przez most. Most przyjmuje od strony `ready` i Intents tylko z origin shella (guard `e.Source`, F11), WebView2 blokuje nawigację poza shell, `NavigationCompleted` nie loguje `OperationCanceled` jako `navigationFailed` (R7/N8), a `ShellBridge` i `ShellWindow` dostają testy ścieżek odrzucenia (R4/N3). Dochodzi vitest w `web/` z testami modelu fokusu."
verify = "`dotnet test` przechodzi z testami: Action w trybie `shell` trafia do Shell, w trybie `app` nie; Intent z obcego origin jest odrzucany z `bridgeMessageRejected`; `LaunchApp` z mostu dociera do Orchestratora. `npm test` w `web/` przechodzi z testami fokusu (Lewo/Prawo po `appId`, OK wysyła `LaunchApp`). Na bieżącej maszynie strzałki klawiatury przesuwają fokus po kafelkach, a OK na kafelku daje w logu `startWithoutHost` i kafelek w `Failed`."
covers = ["R3", "R5", "R8"]
after = [1, 2, "1.1", "1.7", "2.10", "3.5"]
hitl = false
risk = "high"
references = ["architecture-mediastation/architecture-mediastation.md, AD-8 (tabela routingu, wiersz shell)", "architecture-mediastation/architecture-mediastation.md, AD-16", "tickets/epic-foundation-contracts/epic-foundation-contracts-retrospective.md, F11, R4/N3, R7/N8"]

[[entry]]
id = 4
type = "story"
title = "Zakładki Video, Audio i Game z category"
description = "Shell grupuje kafelki w zakładki Video, Audio i Game według `category` i kolejności wpisów w `apps.json`; zakładka aktywuje się na fokus, Lewo/Prawo przechodzi między zakładkami, Dół wraca na zapamiętany kafelek tej zakładki (pamięć fokusu per zakładka po `appId`), Góra z kafelków wraca na zakładki; zakładka bez wpisów pokazuje empty state „Tu jeszcze cisza. Muzyka dojdzie wkrótce.”, a fokus zostaje na zakładce i Dół nic nie robi."
verify = "`npm test` przechodzi z testami: grupowanie i kolejność kafelków z `category`, pamięć fokusu per zakładka po `appId` po przestawieniu wpisów, empty state Audio bez elementu fokusowalnego; na bieżącej maszynie sample `apps.json` daje trzy zakładki, a strzałki przechodzą między nimi."
covers = ["R1", "R3"]
after = [3]
hitl = false
risk = "medium"
references = ["ux-mediastation/EXPERIENCE.md, Component Patterns (Tab, Empty state)"]

[[entry]]
id = 5
type = "story"
title = "Kafelek wg DESIGN.md: ikona, tytuł, chip i linia stanu"
description = "Snapshot dostaje `type` aplikacji z `apps.json`, a kafelek używa `title` i `icon` ze snapshotu ze story 3. Kafelek pokazuje ikonę z `config/icons/` (brak pliku: sam tytuł i wpis `warn`; ikony podaje host tak, żeby guard origin i blokada nawigacji ze story 3 dalej obowiązywały), tytuł oraz chip i linię stanu z tabeli Stany kafelka w `DESIGN.md` dla każdego stanu cyklu życia, z ikonami Material Symbols Rounded i fontem Roboto Flex bundlowanymi lokalnie; linia `Background` bez tytułu treści („W tle · wstrzymane” dla `web`, „W tle · wyciszony” dla `moonlight`, Decision w Notes epiki); fokus `focus-ring` z przejściem ok. 150 ms. Walidacja `apps.json` odrzuca puste albo złożone ze spacji `title` i `icon` (F18)."
verify = "`dotnet test` przechodzi z testami walidacji pustego i złożonego ze spacji `title` i `icon`; `npm test` przechodzi z testem chipa i linii stanu dla każdego stanu na snapshotach testowych i z testem fallbacku przy braku ikony; na bieżącej maszynie kafelek `Failed` pokazuje „Nie odpowiada” i „Coś się zacięło. Wciśnij OK”."
covers = ["R2", "R6", "R7"]
after = [4]
hitl = false
risk = "medium"
references = ["ux-mediastation/DESIGN.md, Components (Stany kafelka, Chip, Tile)", "tickets/epic-foundation-contracts/epic-foundation-contracts-retrospective.md, F18"]


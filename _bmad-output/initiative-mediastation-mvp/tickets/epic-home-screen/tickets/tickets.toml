type = "story"
title = "AppMenu: Uruchom ponownie i Zamknij"
description = "Shell otwiera AppMenu (stan efemeryczny UI, Decision w Notes epiki) na long-press OK na kafelku `Background` albo `Failed` oraz na OK na `Failed`, z fokusem na „Uruchom ponownie” przy `Failed`, inaczej na pierwszej pozycji; Góra/Dół między pozycjami, OK wysyła `RestartApp` albo `CloseApp` i zamyka menu, Back zamyka menu z fokusem na kafelku, Home zamyka menu. Long-press na `NotRunning`, `Starting` i `Stopping` oraz OK na `Starting` nic nie robią. Shell sam zamyka menu, gdy jego aplikacja wyjdzie z `Background` i `Failed`, gdy przyjdzie nowe `focusRequest.seq` (najpierw zamknięcie, potem fokus) albo gdy którakolwiek aplikacja jest `Foreground`. Pozycje menu wysyłają `restartApp` i `closeApp` z listy mostu ze story 3. Orchestrator przyjmuje `RestartApp` i `CloseApp` tylko z `Background` albo `Failed` i bez innej aktywnej aplikacji, inaczej `intentIgnored`. `ActionKind.AppMenu` znika z kontraktu, a wartość `appMenu` w `input.json` jest odrzucana jak nieznana wartość enumu (AD-8). Panel nad kafelkiem ze scrimem wg `DESIGN.md`."

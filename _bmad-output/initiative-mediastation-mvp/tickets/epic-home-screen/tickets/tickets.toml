title = "AppMenu: Uruchom ponownie i Zamknij"
description = "Shell otwiera AppMenu (stan efemeryczny UI, Decision w Notes epiki) na long-press OK na kafelku `Background` albo `Failed` oraz na OK na `Failed`, z fokusem na „Uruchom ponownie” przy `Failed`, inaczej na pierwszej pozycji; Góra/Dół między pozycjami, OK wysyła `RestartApp` albo `CloseApp` i zamyka menu, Back zamyka menu z fokusem na kafelku, Home zamyka menu. Long-press na `NotRunning`, `Starting` i `Stopping` oraz OK na `Starting` nic nie robią. Panel nad kafelkiem ze scrimem wg `DESIGN.md`."

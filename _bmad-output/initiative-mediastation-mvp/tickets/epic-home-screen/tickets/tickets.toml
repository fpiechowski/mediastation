# Home screen — entries w kolejności budowy. tickets.py reads it.
# Kolejność tabel = kolejność budowy; `id` nie jest kolejnością.
# Lane Core: 1 i 2 równolegle, potem tracer 3. Po 3: host shella 11; lane web 3 → 4 → 5 (też po 11) → 6, 4 → 7, 5 + 7 → 8, 5 → 9; 10 na końcu.
# Decyzje przecinające kilka stories (AppMenu w Shell, linia Background bez tytułu, ikony w config/icons/, przypisanie długu) są w Notes epiki;
# reguły mostu, eksportu schematów, ikon i AppMenu są w architekturze (AD-8, AD-11, AD-16, commit 11c7d36).
# Ścieżki w `references` są względne do folderu inicjatywy.

[[entry]]
id = 1
type = "story"
title = "Generowanie kontraktów działa przy Application Control"
description = "Sprawia, że eksport JSON Schema z rekordów Core i generowanie typów TS w `web/contracts` działają na maszynie z Application Control bez ręcznych kroków (DW-28): dziś świeży niepodpisany `MediaStation.SchemaExport.dll` jest blokowany (0x800711C7), więc `dotnet build` nie odświeża schematów, a publish wymaga `-p:SkipWebBuild=true`, ręcznego `npm run build` i kopiowania `web/shell/dist`. Mechanizm ustala AD-16: eksport robi test z kategorią `SchemaExport` w `MediaStation.Core.Tests` (zapis tylko przy zmianie, usuwanie nieaktualnych schematów), `tools/MediaStation.SchemaExport` znika z repo i z `MediaStation.slnx`, target `BuildWeb` buduje projekt testów zadaniem `<MSBuild>` i uruchamia `dotnet test --no-build --filter Category=SchemaExport`, a potem tylko generowanie TS i Vite (nigdy budujący `dotnet build`/`dotnet test` jako osobny proces); w `web/` skrypt eksportu i skrypt generowania są osobne; zero pasujących testów albo zablokowany host testów kończy build błędem. Ręcznie napisane `set-managed-windows.schema.json` i `generated/set-managed-windows.ts` zastępuje wynik generatora."
verify = "Na bieżącej maszynie: zmiana pola w rekordzie Core, potem `dotnet build` i `npm run build` w `web/` dają zaktualizowany schemat i typ TS bez kroków ręcznych, a generowanie nie uruchamia osobnego exe ani dll poza tym, co i tak uruchamia `dotnet test`; filtr bez pasujących testów kończy build błędem; zwykły `dotnet publish` zawiera `shell/`; `dotnet test` przechodzi, w tym `CoreMessageContractTests`."
covers = ["R8"]
after = ["1.2"]
hitl = false
risk = "medium"
plan_checkpoint = true
references = ["architecture-mediastation/architecture-mediastation.md, AD-16 (Eksport schematów działa w przebiegu testów)", "deferred-work.md, DW-28", "../plan-ad8-foreground-gate.md"]


[[entry]]
id = 5
type = "story"
title = "Timery w Core oraz timeouty Starting i Stopping"
description = "Dodaje timery bez łamania czystego handlera: handler zwraca `ScheduleTimer{ timerId, due }` i `CancelTimer{ timerId }`, a pętla w App planuje je przez wstrzyknięty `TimeProvider` i wkłada `TimerElapsed{ timerId }` do kolejki; timer jest kluczowany `timerId` i właścicielem, a anuluje go wyłącznie jawne `CancelTimer` (tak skorzysta z niego dobowe sprawdzenie w epic-do-oceny); do tego timeout `Starting` z `settings.startingTimeout` prowadzący do `Failed` i anulowany po `AppWindowAttached`, timeout bezpieczeństwa `Stopping` z nowego `settings.stoppingTimeout` (domyślnie 45 s, dłużej niż 30 s na `quit` Moonlighta; schemat, walidacja i `tools/samples/config/settings.json`) prowadzący do `Failed`, górne granice obu wartości w walidacji `settings.json` (F18) oraz zakaz `TimeProvider.System`, `Stopwatch` i `Environment.TickCount` w `BannedSymbols.txt` z testem granicy Core (N8)."
verify = "Testy z `FakeTimeProvider` przeprowadzają aplikację ze Starting po `startingTimeout` i ze Stopping po `stoppingTimeout` w `Failed`, a po wcześniejszym `AppWindowAttached` albo `CommandCompleted` na `StopApp` timer jest anulowany i nie zmienia stanu; testy walidacji odrzucają obie wartości ponad granicę, a `CoreBoundaryTests` odrzuca ambient time."
covers = ["CAP-2"]
after = [4]
hitl = false
risk = "medium"
references = ["architecture-mediastation/architecture-mediastation.md, AD-14", "epic-foundation-contracts/epic-foundation-contracts-retrospective.md, Findings F18, N8"]


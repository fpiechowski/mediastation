[[entry]]
id = 5
type = "story"
title = "Timery w Core i timeout Starting"
description = "Dodaje timery bez łamania czystego handlera: handler zwraca `ScheduleTimer{ timerId, owner: appId, due }` i `CancelTimer{ timerId }`, a scheduler w Core z wstrzykniętym `TimeProvider` (App go tylko hostuje) wkłada `TimerElapsed{ timerId }` do kolejki, timer anuluje wyłącznie jawne `CancelTimer` (tak skorzysta z niego dobowe sprawdzenie w epic-do-oceny), a `TimerElapsed` z nieznanym albo anulowanym `timerId` jest ignorowany; do tego timeout `Starting` z `settings.startingTimeout` prowadzący do `Failed` i anulowany po `AppWindowAttached` oraz zakaz `TimeProvider.System`, `Stopwatch` i `Environment.TickCount` w `BannedSymbols.txt` z testem granicy Core (N8); timeout `Stopping` i górne granice dokłada story 11."
verify = "Testy schedulera i Orchestratora z `FakeTimeProvider` przeprowadzają aplikację ze Starting po `startingTimeout` w `Failed`, po wcześniejszym `AppWindowAttached` timer jest anulowany i nie zmienia stanu, `TimerElapsed` anulowanego timera jest ignorowany, a `CoreBoundaryTests` odrzuca ambient time."
covers = ["CAP-2"]
after = [4]
hitl = false
risk = "medium"
references = ["architecture-mediastation/architecture-mediastation.md, AD-14", "epic-foundation-contracts/epic-foundation-contracts-retrospective.md, Findings N8"]


# Orchestrator & app lifecycle — entries w kolejności budowy. tickets.py reads it.
# Kolejność tabel = kolejność budowy; `id` nie jest kolejnością.
# Jeden lane: każda story od 2 do 8, 10 i 11 zmienia handler Orchestratora, więc `after` tworzy łańcuch; story 2 dodatkowo dotyka osobnego kodu (`Platform/System`).
# Decyzje przecinające kilka stories (pierwszy snapshot, tryb wejścia, focusRequest, porty, właściciele Eventów) są w Notes epiki.

[[entry]]
id = 1
type = "story"
title = "Tracer bullet: Orchestrator na własnym wątku publikuje snapshot do shella"
description = "Dodaje w Core Orchestrator jako czysty handler (komunikat → Commands i snapshot) z monotonicznym `rev` i Eventem `OrchestratorStarted`, z którego powstaje pierwszy snapshot z `focusRequest{default}`, a w kontraktach enum stanów cyklu życia (NotRunning, Starting, Foreground, Background, Stopping, Failed), `apps[]` w snapshocie (`appId`, `category`, stan) i `focusRequest { target: default|<appId>, seq }`, które używają kolejne stories; w App pętlę Orchestratora na dedykowanym wątku z jedną kolejką (przy błędzie configu Orchestrator nie startuje, a shell dostaje snapshot `ConfigError` jak dziś), publikację snapshotu latest-wins przeniesioną na wątek UI (F12) z wpisem logu `snapshotPublished {rev, focusRequest}`, podpięcie w composition root z pokryciem jednego wpisu logu na nieobsłużony wyjątek UI (`DispatcherLogged`, R4/N3) helperem wydzielonym do Core z testem, aktualizację guardu `isSnapshot` w `web/shell/src/bridge.ts` i `ShellSnapshotFactoryTests` na poprawnym `ConfigResult` (N8)."
verify = "`dotnet test` przechodzi z testami monotonicznego `rev`, `focusRequest{default}` w snapshocie z `OrchestratorStarted` i helpera `DispatcherLogged`, a Release self-contained uruchomiony przez autora na UM760 pokazuje placeholder shella i zostawia w logu `snapshotPublished` z `focusRequest {target: default, seq: 1}`."
covers = ["CAP-2"]
after = ["1.2", "1.3", "1.6"]
hitl = false
risk = "medium"
references = ["architecture-mediastation/architecture-mediastation.md, AD-2", "architecture-mediastation/architecture-mediastation.md, AD-14", "architecture-mediastation/architecture-mediastation.md, AD-16", "epic-foundation-contracts/epic-foundation-contracts-retrospective.md, Findings F12, N3, N8"]

[[entry]]
id = 2
type = "story"
title = "SystemEvents: wybudzenie z Modern Standby na UM760"
description = "Dodaje produkcyjny adapter power w `Platform/System`, który na UM760 loguje każdy kandydujący sygnał wybudzenia jako `powerSignal {source}` (`PBT_APMRESUMEAUTOMATIC`, `GUID_CONSOLE_DISPLAY_STATE`, `PowerModeChanged`), wybiera jeden według reguły z Notes epiki i wysyła do kolejki Orchestratora Event `SystemResumed`, na który Orchestrator przechodzi na ekran główny i publikuje snapshot z nowym `seq` `focusRequest{default}`; pełną politykę wybudzenia (Background dla aplikacji na pierwszym planie, `RenewSession`, zastępowanie przełączenia) dokłada story 8."
verify = "Na UM760 uśpienie do Modern Standby i wybudzenie pilotem zostawia w logu `powerSignal` każdego kandydata, jeden `systemResumed` i `snapshotPublished` z `focusRequest{default}` o `seq` większym niż przed uśpieniem, a test Core sprawdza ten sam wynik dla `SystemResumed`."
covers = ["CAP-2"]
after = [1]
hitl = false
risk = "high"
references = ["architecture-mediastation/architecture-mediastation.md, AD-10", "research-browser-control-for-streaming-services/digests/spike-um760.md, claim S7/S8 (CDP zrywa się po Modern Standby)"]

[[entry]]
id = 3
type = "story"
title = "Porty i ścieżka uruchomienia aplikacji"
description = "Dodaje Intent `LaunchApp{ appId }` (wybór kafelka) eksportowany do JSON Schema i TS (AD-16; `ShellBridge` nadal nie przyjmuje Intents, to epic-home-screen), porty hostów per `AppType` ze `StartApp` z `cmdId` i korelacją `CommandCompleted`/`CommandFailed` (`CommandCompleted` na `StartApp` nie zmienia stanu, a `CommandFailed` jest w tej story tylko logowany), Event `AppWindowAttached{ appId, hwnd, rootPid }`, przejścia NotRunning → Starting → Foreground (Foreground daje tylko `AppWindowAttached`; `LaunchApp` w Starting albo z nieznanym `appId` jest ignorowany), port WindowManager z komendami `ActivateWindow{hwnd}`, `MinimizeWindow` i `ShowShell` (pełne sekwencje restore → odblokowanie foreground → unmute i pause → mute → minimize dokłada epic-windows-audio; `MinimizeWindow` i `ShowShell` używają stories 10, 4, 6, 7 i 8), `SetInputRouting` z monotonicznym `epoch` nadawanym przez Orchestrator według reguły trybu z Notes epiki (`{shell}` w obsłudze `OrchestratorStarted` ze story 1), oraz w composition root adapter „brak hosta”, który na `StartApp` odpowiada `CommandFailed{Unexpected}` (przejście w `Failed` dokłada story 4), i adaptery tylko-log dla WindowManager i `SetInputRouting`, które podmieniają epic-windows-audio i epic-input."
verify = "Testy Orchestratora na fake'ach portów przechodzą przez NotRunning → Starting → Foreground z `StartApp`, `ActivateWindow` po `AppWindowAttached`, `SetInputRouting{shell}` przy starcie i `SetInputRouting{app}` z większym `epoch` dopiero przy Foreground, ze stanem aplikacji w snapshocie, a wynik ze złym `cmdId`, `CommandCompleted` na `StartApp` i `LaunchApp` w Starting nie zmieniają stanu."
covers = ["CAP-2"]
after = [2]
hitl = false
risk = "medium"
references = ["architecture-mediastation/architecture-mediastation.md, AD-4", "architecture-mediastation/architecture-mediastation.md, AD-5", "architecture-mediastation/architecture-mediastation.md, AD-8 (tabela routingu)", "architecture-mediastation/architecture-mediastation.md, AD-15"]

[[entry]]
id = 10
type = "story"
title = "Home, przełączanie i zamykanie aplikacji"
description = "Dodaje obsługę `Action{Home}` (rekord z 1.2), po której aplikacja w Foreground przechodzi w Background komendami w kolejności `MinimizeWindow`, `ShowShell`, `SetInputRouting{shell}` bez zmiany `focusRequest`, powrót Background → Foreground przez `LaunchApp` ze story 3 z `ActivateWindow` i `SetInputRouting{app}`, Intents `CloseApp{ appId }` i `RestartApp{ appId }` (AppMenu, tylko dla Background; eksport do JSON Schema i TS) ze `StopApp` i przejściem Background → Stopping, które kończy `CommandCompleted` na `StopApp` albo oczekiwany `ProcessExited` (→ NotRunning, przy restarcie dalej Starting, a `AppWindowAttached` daje Foreground jak po `LaunchApp`), oraz Eventy `ProcessExited{ appId }` i `ForegroundChanged{ hwnd }`, z których ten drugi jest zapisywany i logowany bez reakcji; z `CloseApp`/`RestartApp` korzysta wyjście z `Failed` w story 4, a z przejścia przy Home stories 6 i 8."
verify = "Testy Orchestratora przechodzą przez Foreground → Background (Home, z komendami w podanej kolejności i bez nowego `focusRequest`) → Foreground (`LaunchApp`) → Background → Stopping → NotRunning (`CloseApp`) oraz Background → Stopping → Starting → Foreground (`RestartApp`), a `ForegroundChanged` zostawia wpis w logu i nie zmienia stanu."
covers = ["CAP-2"]
after = [3]
hitl = false
risk = "medium"
references = ["architecture-mediastation/architecture-mediastation.md, AD-5", "architecture-mediastation/architecture-mediastation.md, AD-8 (AppMenu)", "architecture-mediastation/architecture-mediastation.md, AD-15", "ux-mediastation/EXPERIENCE.md, Interaction Primitives (fokus: powrót na Home → ostatni kafelek)"]

